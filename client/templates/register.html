{% extends "base.html" %}
{% block title %}Register - WhisperChain+{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Username <input name="username" autocomplete="username" required>
    <span class="hint">3-32 characters: lowercase letters, digits, underscore</span></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Password again <input name="password2" type="password" autocomplete="new-password" required></label>
  <p class="hint">A key pair is generated on this machine. Only the public key is sent to the server.
    An admin has to approve your account before you can log in.</p>
  <button type="submit" class="primary">Register</button>
</form>
<p><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
